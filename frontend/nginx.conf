# Any Host header other than localhost/127.0.0.1 lands here and gets the
# connection closed with no response — this is the default server for
# port 8080, so it is what handles every hostname the real block doesn't
# explicitly claim.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    # nginx drops every inherited add_header in a location that declares one
    # of its own, so X-Frame-Options has to be repeated below wherever
    # Cache-Control is set — do not "simplify" this back down to the
    # server-level line alone, it silently stops reaching / and /assets/.
    add_header X-Frame-Options DENY always;

    # A song's audio and video, relayed by the backend for Guess the Opening/Ending.
    # They are passed through and never stored, so nginx must not buffer them: with
    # buffering on, a client slower than the backend makes nginx spill the response to
    # a file in its temp folder. A regex location, so it is matched ahead of /api/ below;
    # that also means proxy_pass can't carry a URI, which would make nginx rewrite the
    # path. Without one the request goes to the backend exactly as it came, query and
    # all, to the same address /api/ reaches. AnimeThemes can take most of a minute to
    # start sending a file and the backend waits for it (75 seconds at most), sending
    # nothing meanwhile, so nginx's 60-second read timeout would cut the wait short.
    location ~ ^/api/games/guess-the-theme/(runs/[0-9]+/clip|video)$ {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_read_timeout 100s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite's build hashes every asset filename by content, so a build that
    # changes a file always ships it under a new URL — these can be cached
    # forever. index.html is the one file whose URL never changes despite
    # pointing at whichever hashed bundle is current, so it must always be
    # revalidated; without this, no cache-control header was set at all,
    # leaving each browser's own (very different) caching heuristics to
    # decide when to notice a new build — Safari in particular has kept
    # serving a stale index.html (and therefore a stale bundle) well after
    # Chrome had picked up a new one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options DENY always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}
